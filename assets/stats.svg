  <circle cx="648" cy="157" r="6" fill="#3178c6"/><text x="662" y="162" font-size="14" fill="#e2e8f0">TypeScript <tspan fill="#7c83b0">23.6%</tspan></text>
  <circle cx="458" cy="185" r="6" fill="#3572A5"/><text x="472" y="190" font-size="14" fill="#e2e8f0">Python <tspan fill="#7c83b0">19.7%</tspan></text>
  <circle cx="648" cy="185" r="6" fill="#e34c26"/><text x="662" y="190" font-size="14" fill="#e2e8f0">HTML <tspan fill="#7c83b0">10.2%</tspan></text>
  <circle cx="458" cy="213" r="6" fill="#f34b7d"/><text x="472" y="218" font-size="14" fill="#e2e8f0">C++ <tspan fill="#7c83b0">3.5%</tspan></text>
  <circle cx="648" cy="213" r="6" fill="#663399"/><text x="662" y="218" font-size="14" fill="#e2e8f0">CSS <tspan fill="#7c83b0">2.5%</tspan></text>
