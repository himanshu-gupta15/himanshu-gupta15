<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" font-family="&#x27;JetBrains Mono&#x27;,&#x27;Fira Code&#x27;,&#x27;SFMono-Regular&#x27;,Menlo,Consolas,&#x27;Liberation Mono&#x27;,monospace">
  <style>
    text { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .reveal { animation: fadeUp .5s ease-out both; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    
  </style>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1b1b4a" stroke-width=".6"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="#05051a"/>
  <rect width="100%" height="100%" rx="16" fill="url(#grid)" opacity=".55"/>

  <rect x="24" y="20" width="952" height="250" rx="14" fill="#0a0a2e" stroke="#22d3ee" stroke-width="2" filter="url(#glow)" opacity=".95"/>
  <rect x="24" y="20" width="952" height="250" rx="14" fill="#0a0a2e" stroke="#22d3ee" stroke-opacity=".9" stroke-width="1.4"/>
  <circle cx="48" cy="42" r="6" fill="#ff5f57"/><circle cx="68" cy="42" r="6" fill="#febc2e"/><circle cx="88" cy="42" r="6" fill="#28c840"/>
  <line x1="24" y1="64" x2="976" y2="64" stroke="#23235a"/>
  <text x="954" y="46" text-anchor="end" font-size="12" fill="#e2e8f0" font-weight="700">~/stats --live</text>
  <text x="56" y="96" font-size="15" font-weight="800" fill="#f472b6" filter="url(#softglow)">Himanshu's GitHub Stats</text>
  <text class="reveal" style="animation-delay:0.20s" x="56" y="126" font-size="13"><tspan fill="#22d3ee">★</tspan><tspan fill="#e2e8f0" dx="8">Total Stars Earned:</tspan></text>
  <text class="reveal" style="animation-delay:0.20s" x="400" y="126" text-anchor="end" font-size="13" font-weight="800" fill="#4ade80">8</text>
  <text class="reveal" style="animation-delay:0.30s" x="56" y="149" font-size="13"><tspan fill="#22d3ee">◆</tspan><tspan fill="#e2e8f0" dx="8">Total Commits (last year):</tspan></text>
  <text class="reveal" style="animation-delay:0.30s" x="400" y="149" text-anchor="end" font-size="13" font-weight="800" fill="#4ade80">560</text>
  <text class="reveal" style="animation-delay:0.40s" x="56" y="172" font-size="13"><tspan fill="#22d3ee">⇄</tspan><tspan fill="#e2e8f0" dx="8">Total PRs:</tspan></text>
  <text class="reveal" style="animation-delay:0.40s" x="400" y="172" text-anchor="end" font-size="13" font-weight="800" fill="#4ade80">12</text>
  <text class="reveal" style="animation-delay:0.50s" x="56" y="195" font-size="13"><tspan fill="#22d3ee">!</tspan><tspan fill="#e2e8f0" dx="8">Total Issues:</tspan></text>
  <text class="reveal" style="animation-delay:0.50s" x="400" y="195" text-anchor="end" font-size="13" font-weight="800" fill="#4ade80">0</text>
  <text class="reveal" style="animation-delay:0.60s" x="56" y="218" font-size="13"><tspan fill="#22d3ee">⌘</tspan><tspan fill="#e2e8f0" dx="8">Public Repos:</tspan></text>
  <text class="reveal" style="animation-delay:0.60s" x="400" y="218" text-anchor="end" font-size="13" font-weight="800" fill="#4ade80">25</text>
  <text class="reveal" style="animation-delay:0.70s" x="56" y="241" font-size="13"><tspan fill="#22d3ee">◎</tspan><tspan fill="#e2e8f0" dx="8">Contributed to (last year):</tspan></text>
  <text class="reveal" style="animation-delay:0.70s" x="400" y="241" text-anchor="end" font-size="13" font-weight="800" fill="#4ade80">1</text>
  <line x1="440" y1="76" x2="440" y2="250" stroke="#23235a"/>
  <text x="476" y="96" font-size="15" font-weight="800" fill="#22d3ee" filter="url(#softglow)">Most Used Languages</text>
  <clipPath id="bar"><rect x="476" y="114" width="468" height="10" rx="5"/></clipPath><g clip-path="url(#bar)">
  <rect x="476.0" y="114" width="172.6" height="10" fill="#f1e05a"/>
  <rect x="648.1" y="114" width="139.5" height="10" fill="#3178c6"/>
  <rect x="787.1" y="114" width="86.5" height="10" fill="#3572A5"/>
  <rect x="873.1" y="114" width="44.5" height="10" fill="#e34c26"/>
  <rect x="917.1" y="114" width="20.9" height="10" fill="#f34b7d"/>
  <rect x="937.5" y="114" width="7.0" height="10" fill="#663399"/>
  </g>
  <circle cx="481" cy="146" r="5" fill="#f1e05a"/><text x="494" y="150" font-size="12.5" fill="#e2e8f0">JavaScript <tspan fill="#7c83b0">36.8%</tspan></text>
  <circle cx="721" cy="146" r="5" fill="#3178c6"/><text x="734" y="150" font-size="12.5" fill="#e2e8f0">TypeScript <tspan fill="#7c83b0">29.7%</tspan></text>
  <circle cx="481" cy="170" r="5" fill="#3572A5"/><text x="494" y="174" font-size="12.5" fill="#e2e8f0">Python <tspan fill="#7c83b0">18.4%</tspan></text>
  <circle cx="721" cy="170" r="5" fill="#e34c26"/><text x="734" y="174" font-size="12.5" fill="#e2e8f0">HTML <tspan fill="#7c83b0">9.4%</tspan></text>
  <circle cx="481" cy="194" r="5" fill="#f34b7d"/><text x="494" y="198" font-size="12.5" fill="#e2e8f0">C++ <tspan fill="#7c83b0">4.4%</tspan></text>
  <circle cx="721" cy="194" r="5" fill="#663399"/><text x="734" y="198" font-size="12.5" fill="#e2e8f0">CSS <tspan fill="#7c83b0">1.4%</tspan></text>
</svg>
