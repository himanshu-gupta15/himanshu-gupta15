<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" font-family="&#x27;JetBrains Mono&#x27;,&#x27;Fira Code&#x27;,&#x27;SFMono-Regular&#x27;,Menlo,Consolas,&#x27;Liberation Mono&#x27;,monospace">
  <style>
    text { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .reveal { animation: fadeUp .5s ease-out both; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    
  </style>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1b1b4a" stroke-width=".6"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="#05051a"/>
  <rect width="100%" height="100%" rx="16" fill="url(#grid)" opacity=".55"/>

  <rect x="16" y="16" width="828" height="288" rx="14" fill="#0a0a2e" stroke="#22d3ee" stroke-width="2" filter="url(#glow)" opacity=".95"/>
  <rect x="16" y="16" width="828" height="288" rx="14" fill="#0a0a2e" stroke="#22d3ee" stroke-opacity=".9" stroke-width="1.4"/>
  <circle cx="40" cy="38" r="6" fill="#ff5f57"/><circle cx="60" cy="38" r="6" fill="#febc2e"/><circle cx="80" cy="38" r="6" fill="#28c840"/>
  <line x1="16" y1="60" x2="844" y2="60" stroke="#23235a"/>
  <text x="822" y="42" text-anchor="end" font-size="12" fill="#e2e8f0" font-weight="700">~/stats --live</text>
  <text x="40" y="98" font-size="17" font-weight="800" fill="#f472b6" filter="url(#softglow)">Himanshu's GitHub Stats</text>
  <text class="reveal" style="animation-delay:0.20s" x="40" y="132" font-size="14.5"><tspan fill="#22d3ee">★</tspan><tspan fill="#e2e8f0" dx="8">Total Stars Earned:</tspan></text>
  <text class="reveal" style="animation-delay:0.20s" x="404" y="132" text-anchor="end" font-size="15" font-weight="800" fill="#4ade80">8</text>
  <text class="reveal" style="animation-delay:0.30s" x="40" y="160" font-size="14.5"><tspan fill="#22d3ee">◆</tspan><tspan fill="#e2e8f0" dx="8">Total Commits (last year):</tspan></text>
  <text class="reveal" style="animation-delay:0.30s" x="404" y="160" text-anchor="end" font-size="15" font-weight="800" fill="#4ade80">560</text>
  <text class="reveal" style="animation-delay:0.40s" x="40" y="188" font-size="14.5"><tspan fill="#22d3ee">⇄</tspan><tspan fill="#e2e8f0" dx="8">Total PRs:</tspan></text>
  <text class="reveal" style="animation-delay:0.40s" x="404" y="188" text-anchor="end" font-size="15" font-weight="800" fill="#4ade80">12</text>
  <text class="reveal" style="animation-delay:0.50s" x="40" y="216" font-size="14.5"><tspan fill="#22d3ee">!</tspan><tspan fill="#e2e8f0" dx="8">Total Issues:</tspan></text>
  <text class="reveal" style="animation-delay:0.50s" x="404" y="216" text-anchor="end" font-size="15" font-weight="800" fill="#4ade80">0</text>
  <text class="reveal" style="animation-delay:0.60s" x="40" y="244" font-size="14.5"><tspan fill="#22d3ee">⌘</tspan><tspan fill="#e2e8f0" dx="8">Public Repos:</tspan></text>
  <text class="reveal" style="animation-delay:0.60s" x="404" y="244" text-anchor="end" font-size="15" font-weight="800" fill="#4ade80">32</text>
  <text class="reveal" style="animation-delay:0.70s" x="40" y="272" font-size="14.5"><tspan fill="#22d3ee">◎</tspan><tspan fill="#e2e8f0" dx="8">Contributed to (last year):</tspan></text>
  <text class="reveal" style="animation-delay:0.70s" x="404" y="272" text-anchor="end" font-size="15" font-weight="800" fill="#4ade80">3</text>
  <line x1="428" y1="76" x2="428" y2="286" stroke="#23235a"/>
  <text x="452" y="98" font-size="17" font-weight="800" fill="#22d3ee" filter="url(#softglow)">Most Used Languages</text>
