  <rect x="452.0" y="118" width="151.0" height="12" fill="#f1e05a"/>
  <rect x="602.5" y="118" width="88.1" height="12" fill="#3178c6"/>
  <rect x="690.1" y="118" width="73.9" height="12" fill="#3572A5"/>
  <rect x="763.5" y="118" width="38.5" height="12" fill="#e34c26"/>
  <rect x="801.6" y="118" width="13.5" height="12" fill="#f34b7d"/>
  <rect x="814.5" y="118" width="10.0" height="12" fill="#663399"/>
  </g>
